name: CI

# Manual only. Every dispatch counts against the CI budget in the mission
# library, so nothing here runs on push, tag, or pull request.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: Comma-separated build targets (macos-arm64, linux-x64, linux-arm64)
        type: string
        default: macos-arm64,linux-x64,linux-arm64
      suite:
        description: Which jobs to run
        type: choice
        options:
          - gate
          - engine
          - package
          - e2e
          - full
        default: gate

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  GGML_NATIVE: "OFF"

jobs:
  gate:
    if: inputs.suite == 'gate' || inputs.suite == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Gate
        run: cargo xtask gate

  plan:
    if: inputs.suite != 'gate'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          all='[
            {"target":"macos-arm64","os":"macos-15"},
            {"target":"linux-x64","os":"ubuntu-22.04"},
            {"target":"linux-arm64","os":"ubuntu-22.04-arm"}
          ]'
          picked=$(jq -c --arg wanted ",${TARGETS// /}," \
            '[.[] | select(.target as $t | $wanted | contains("," + $t + ","))]' <<<"$all")
          if [ "$picked" = "[]" ]; then
            echo "::error::targets '$TARGETS' matches none of macos-arm64, linux-x64, linux-arm64"
            exit 1
          fi
          echo "matrix={\"include\":$picked}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Release build
        run: cargo build --release --locked -p hushpen-app -p hushpen-llm
      - name: Run both binaries
        run: |
          ./target/release/hushpen --version
          ./target/release/hushpen-llm --version
      - name: Show the whisper.cpp build settings
        if: inputs.suite == 'engine' || inputs.suite == 'full'
        run: |
          cache=$(find target/release/build -path '*whisper-rs-sys-*' -name CMakeCache.txt | head -n 1)
          echo "CMakeCache: $cache"
          grep -E '^(GGML_NATIVE|GGML_AVX2|GGML_FMA|GGML_F16C|GGML_METAL|WHISPER_BUILD_IS_DEV):' "$cache"
          grep -q '^GGML_NATIVE:BOOL=OFF$' "$cache"
          if grep -E -- '-mcpu=native|-march=native' "$(dirname "$cache")/compile_commands.json"; then
            echo "::error::native CPU flags in the ggml build"
            exit 1
          fi
          grep -h 'whisper.cpp version' target/release/build/whisper-rs-sys-*/output
      - name: Cache the engine test model
        if: inputs.suite == 'engine' || inputs.suite == 'full'
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models/ggml-tiny.en.bin
          key: ggml-tiny.en-921e4cf8686fdd993dcd081a5da5b6c365bfde1162e72b08d75ac75289920b1f
      - name: Download the engine test model
        if: (inputs.suite == 'engine' || inputs.suite == 'full') && steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -fsSL --retry 3 -o models/ggml-tiny.en.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin
      - name: Engine smoke (CPU, 2 threads)
        if: inputs.suite == 'engine' || inputs.suite == 'full'
        env:
          HUSHPEN_TEST_MODEL: ${{ github.workspace }}/models/ggml-tiny.en.bin
        run: |
          echo "921e4cf8686fdd993dcd081a5da5b6c365bfde1162e72b08d75ac75289920b1f  models/ggml-tiny.en.bin" | shasum -a 256 -c -
          cargo test --release -p hushpen-engine --features heavy --test it --locked -- --test-threads=1 --nocapture
      - name: Engine smoke (Metal, best effort)
        if: (inputs.suite == 'engine' || inputs.suite == 'full') && matrix.target == 'macos-arm64'
        continue-on-error: true
        env:
          HUSHPEN_TEST_MODEL: ${{ github.workspace }}/models/ggml-tiny.en.bin
          HUSHPEN_TEST_GPU: "1"
        run: cargo test --release -p hushpen-engine --features heavy --test it --locked transcribes_short_clip_on_gpu -- --nocapture
